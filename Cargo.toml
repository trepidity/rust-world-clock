[package]
name = "rust-world-clock"
version = "1.0.2"
edition = "2024"

[dependencies]
chrono = "0.4.42"
chrono-tz = "0.10.4"
clap = { version = "4.5.54", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
iana-time-zone = "0.1.65"
iced = { version = "0.14", features = ["canvas", "tokio"] }
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1"
